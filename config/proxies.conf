# Base domain.
# Proxy mappings only need the subdomain prefix.
# Template variable {{CERT_DOMAIN}} also uses this value.
domain = xxx.com

# Email for Let’s Encrypt registration and recovery notices.
email = admin@example.com

# Cloudflare API token with DNS edit permission for the base domain zone.
cloudflare_api_token = replace-me

# Proxy mappings:
# subdomain -> ip:port
sub_name -> 1.85.61.130:29202
abc -> 127.0.0.1:8080
